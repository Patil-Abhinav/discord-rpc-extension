<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Discord RPC</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 340px;
      margin: 0;
      padding: 16px;
      background-color: #2b2d31;
      color: #dbdee1;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #313338;
      border: 1px solid #3f4147;
      color: #949ba4;
    }
    .badge.connected {
      color: #57f287;
      border-color: #23a55a;
    }
    .form-group {
      margin-bottom: 9px;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #b5bac1;
      margin-bottom: 3px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      border-radius: 4px;
      border: 1px solid #1e1f22;
      background: #1e1f22;
      color: #ffffff;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #5865f2;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    .row .form-group {
      flex: 1;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding: 6px 8px;
      background: #232428;
      border-radius: 4px;
    }
    .checkbox-row input {
      width: auto;
      margin: 0;
      cursor: pointer;
    }
    .checkbox-row label {
      margin: 0;
      font-size: 11px;
      text-transform: none;
      color: #dbdee1;
      cursor: pointer;
      font-weight: 500;
    }
    .timer-card {
      background: #232428;
      border: 1px solid #313338;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 6px;
    }
    .timer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .timer-header span {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #b5bac1;
    }
    .timer-display {
      font-size: 12px;
      font-weight: 700;
      color: #57f287;
    }
    .timer-buttons-row {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }
    .timer-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 600;
      background: #313338;
      color: #dbdee1;
      border: 1px solid #3f4147;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
    }
    .timer-btn:hover {
      background: #5865f2;
      color: #ffffff;
      border-color: #5865f2;
    }
    .timer-btn.negative:hover {
      background: #ed4245;
      color: #ffffff;
      border-color: #ed4245;
    }
    .timer-btn.reset:hover {
      background: #4e5058;
      color: #ffffff;
    }
    .custom-hours-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #313338;
      align-items: center;
    }
    .custom-hours-row input {
      width: 75px;
      padding: 5px 8px;
      font-size: 12px;
      text-align: center;
    }
    .custom-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .custom-btn.add {
      background-color: #23a55a;
      color: white;
    }
    .custom-btn.add:hover {
      background-color: #1f9250;
    }
    .custom-btn.sub {
      background-color: #da373c;
      color: white;
    }
    .custom-btn.sub:hover {
      background-color: #b82d31;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button.main-btn {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #connectBtn {
      background-color: #5865f2;
      color: white;
    }
    #connectBtn:hover {
      background-color: #4752c4;
    }
    #clearBtn {
      background-color: #4e5058;
      color: white;
    }
    #clearBtn:hover {
      background-color: #6d6f78;
    }
    #statusMessage {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 16px;
      color: #949ba4;
      word-break: break-word;
    }
    #statusMessage.success { color: #57f287; }
    #statusMessage.error { color: #ed4245; }
  </style>
</head>
<body>
  <h2>
    Discord RPC (Browser Only)
    <span id="gatewayStatus" class="badge">Offline</span>
  </h2>

  <div class="form-group">
    <label for="userToken">Discord User Token</label>
    <input type="password" id="userToken" placeholder="Paste Discord user token here" />
  </div>

  <div class="form-group">
    <label for="details">Details</label>
    <input type="text" id="details" value="LunaticHost" />
  </div>

  <div class="form-group">
    <label for="state">State</label>
    <input type="text" id="state" value="Promptblox" />
  </div>

  <div class="row">
    <div class="form-group">
      <label for="largeImage">Large Image</label>
      <input type="text" id="largeImage" value="lunatichost" />
    </div>
    <div class="form-group">
      <label for="smallImage">Small Image</label>
      <input type="text" id="smallImage" value="promptblox" />
    </div>
  </div>

  <div class="form-group">
    <label>Button 1 (Label & Website URL)</label>
    <div class="row">
      <input type="text" id="btn1Text" value="LunaticHost" style="flex: 1;" />
      <input type="text" id="btn1Url" value="https://lunatichost.com" style="flex: 2;" />
    </div>
  </div>

  <div class="form-group">
    <label>Button 2 (Label & Website URL)</label>
    <div class="row">
      <input type="text" id="btn2Text" value="Promptblox.ai" style="flex: 1;" />
      <input type="text" id="btn2Url" value="https://promptblox.ai" style="flex: 2;" />
    </div>
  </div>

  <!-- Timer Adjuster Card -->
  <div class="timer-card">
    <div class="timer-header">
      <span>Adjust Elapsed Time</span>
      <span id="timerOffsetDisplay" class="timer-display">+0h</span>
    </div>

    <!-- Quick Presets -->
    <div class="timer-buttons-row">
      <button type="button" class="timer-btn" data-hours="1">+1h</button>
      <button type="button" class="timer-btn" data-hours="10">+10h</button>
      <button type="button" class="timer-btn" data-hours="20">+20h</button>
    </div>
    <div class="timer-buttons-row">
      <button type="button" class="timer-btn negative" data-hours="-1">-1h</button>
      <button type="button" class="timer-btn negative" data-hours="-10">-10h</button>
      <button type="button" class="timer-btn negative" data-hours="-20">-20h</button>
      <button type="button" class="timer-btn reset" id="resetOffsetBtn">Reset</button>
    </div>

    <!-- Custom Hours Input (+ / - any custom number of hours) -->
    <div class="custom-hours-row">
      <input type="number" id="customHoursInput" placeholder="Hours" min="1" max="99999" value="5" />
      <button type="button" id="customAddBtn" class="custom-btn add">+ Add Hours</button>
      <button type="button" id="customSubBtn" class="custom-btn sub">- Remove Hours</button>
    </div>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="keepTimer" checked />
    <label for="keepTimer">Keep original timer across PC / Chrome restarts</label>
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="preventIdle" checked />
    <label for="preventIdle">Prevent Idle (Always stay green Online)</label>
  </div>

  <div class="btn-row">
    <button id="connectBtn" class="main-btn">Connect Status</button>
    <button id="clearBtn" class="main-btn">Disconnect</button>
  </div>

  <div id="statusMessage"></div>

  <script src="popup.js"></script>
</body>
</html>
